name: Update and deploy

on:
  schedule:
    - cron: '*/10 * * * *'      # every 10 minutes (GitHub may run it a little late)
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-download every season from scratch'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'site.webmanifest', 'assets/**', 'config.json', 'fetch-sleeper.mjs']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data from Sleeper
        run: node fetch-sleeper.mjs
        env:
          FULL_REFRESH: ${{ inputs.full }}

      - name: Save new data
        id: commit
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            CHANGED=false
          else
            git commit -m "Update league data"
            git push
            CHANGED=true
          fi
          if [ "$CHANGED" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site folder
        if: steps.commit.outputs.deploy == 'true'
        run: |
          mkdir _site
          cp index.html sw.js site.webmanifest _site/
          cp -r assets _site/assets
          cp -r data _site/data

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

